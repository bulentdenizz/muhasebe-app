<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <link href="../../dist/output.css" rel="stylesheet">
  <title>Ön Muhasebe v1.0</title>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <div id="cariModal" class="hidden fixed inset-0 z-50 overflow-auto bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-md m-4">
        <div class="p-6 border-b bg-gray-50 rounded-t-lg">
            <h3 class="text-xl font-bold text-gray-800">Yeni Cari Kaydı</h3>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700">Unvan / Ad Soyad</label>
                <input type="text" id="unvan" class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700">Telefon</label>
                <input type="text" id="telefon" class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700">Başlangıç Bakiyesi</label>
                <input type="number" id="bakiye" value="0" class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>
        <div class="p-6 border-t flex justify-end space-x-3 bg-gray-50 rounded-b-lg">
            <button onclick="modalKapat()" class="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded transition">Vazgeç</button>
            <button onclick="cariKaydet()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition font-medium shadow-md">Kaydet</button>
        </div>
    </div>
  </div>

  <div class="flex h-screen">
    <aside class="w-64 bg-gray-900 text-white flex flex-col">
      <div class="h-16 flex items-center justify-center border-b border-gray-800">
        <h1 class="text-xl font-bold tracking-wider">MUHASEBE PRO</h1>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-2">
        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-800">Ana Sayfa</a>
        <a href="#" class="block px-4 py-2 bg-blue-600 rounded-md">Cari Hesaplar</a>
        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-800">Stok Yönetimi</a>
        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-800">Faturalar</a>
      </nav>
    </aside>

    <main class="flex-1 flex flex-col">
      <header class="h-16 bg-white shadow-sm flex items-center px-8 text-2xl font-semibold text-gray-700">
        Cari Hesaplar
      </header>

      <div class="flex-1 p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
          <div class="w-1/3">
            <input type="text" placeholder="Ara..." class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <button onclick="modalAc()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-medium">
            + Yeni Cari Ekle
          </button>
        </div>

        <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
          <table class="w-full text-left">
            <thead class="bg-gray-50 border-b">
              <tr>
                <th class="p-4">Unvan</th><th class="p-4">Telefon</th><th class="p-4">Bakiye</th><th class="p-4 text-right">İşlemler</th>
              </tr>
            </thead>
            <tbody id="cariListesi">
               </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
